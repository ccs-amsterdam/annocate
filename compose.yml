# AnnoTinder with Postgres and daily database dumps (docs/hosting.md).
# The repository is the app's folder: settings in `.env` (from `.env.example`),
# dumps in `backups/`. The app listens on 127.0.0.1:8787 only, for a proxy on
# this machine that does HTTPS (Caddy). Build and start, with the commit:
#   sudo ANNOTINDER_COMMIT=$(sudo -u sal git rev-parse --short HEAD) docker compose up -d --build
# On a server with nothing else on ports 80 and 443, the `caddy` profile runs
# that proxy here as well (COMPOSE_PROFILES=caddy in .env, or --profile caddy).

# Container logs (`docker compose logs`) are files that Docker never trims by
# itself: each service keeps at most 3 files of 10 MB.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: .
      args:
        # The commit, recorded with each deployment ("unknown" without it)
        ANNOTINDER_COMMIT: ${ANNOTINDER_COMMIT:-unknown}
    image: annotinder
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      DATABASE_URL: postgres://annotinder:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/annotinder
      # Only reachable through the proxy on this machine (127.0.0.1 below): client addresses from X-Forwarded-For
      ANNOTINDER_TRUST_PROXY: "1"
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.7-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: annotinder
      POSTGRES_USER: annotinder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U annotinder -d annotinder"]
      interval: 10s
      retries: 10

  db-backup:
    # A dump at the start and every day at 02:00 (UTC) into ./backups, kept 7 days
    image: postgres:18.7-alpine
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/db-backup.sh"]
    environment:
      PGHOST: db
      PGUSER: annotinder
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: annotinder
      BACKUP_TIME: "02:00"
      KEEP_DAYS: 7
    volumes:
      - ./scripts/db-backup.sh:/db-backup.sh:ro
      - ./backups:/backups

  caddy:
    # Optional (the `caddy` profile): HTTPS on ports 80 and 443 for
    # ANNOTINDER_PUBLIC_URL, instead of a Caddy installed on the host. In the
    # host's network, so the app sees the real client addresses (also over
    # IPv6) and the Caddyfile forwards to 127.0.0.1:8787 as on the host.
    image: caddy:2.11.9-alpine
    profiles: [caddy]
    restart: unless-stopped
    logging: *logging
    network_mode: host
    environment:
      ANNOTINDER_PUBLIC_URL: ${ANNOTINDER_PUBLIC_URL:?set ANNOTINDER_PUBLIC_URL in .env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificates and the ACME account: keep them, or Let's Encrypt's
      # rate limits may refuse new ones after a few recreations
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  db-data:
  caddy-data:
  caddy-config:
