# Builds the app image (Dockerfile) and publishes it as
# ghcr.io/ccs-amsterdam/annotinder (docs/hosting.md, "Versions"), for amd64 and arm64:
# - every push to a branch: tags the branch (main, or e.g. docker-image; a / in
#   its name becomes -);
# - a tag v<release> (e.g. v0.1.0): also tags 0.1.0, 0.1 and latest.
# The image records the commit it is built from (ANNOTINDER_COMMIT). Images a
# branch tag no longer points to are removed by image-cleanup.yml. Before anything is
# published, the image is started against Postgres and must answer /api/ready.
name: Image

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: A release tag matches the release in the code
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          release=$(sed -n 's/^export const RELEASE = "\(.*\)";/\1/p' packages/contracts/src/version.ts)
          if [ "v$release" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, but RELEASE in packages/contracts/src/version.ts is $release"
            exit 1
          fi

      - name: The commit
        id: commit
        run: echo "short=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/annotinder
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # First the image for this machine, started as in production (Postgres, a secret, a
      # public URL) until it is ready: nothing is published from an image that doesn't start
      - name: Build for the start check
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: annotinder:check
          build-args: ANNOTINDER_COMMIT=${{ steps.commit.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start against Postgres
        run: |
          docker network create check
          docker run -d --name db --network check -e POSTGRES_PASSWORD=check postgres:18.7-alpine
          for i in $(seq 1 30); do docker exec db pg_isready -U postgres -q && break; sleep 1; done
          docker run -d --name app --network check --restart on-failure:5 -p 8787:8787 \
            -e DATABASE_URL=postgres://postgres:check@db:5432/postgres \
            -e ANNOTINDER_SECRET=check-secret-not-for-any-real-server \
            -e ANNOTINDER_PUBLIC_URL=http://localhost:8787 \
            annotinder:check
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8787/api/ready >/dev/null; then
              curl -sf http://localhost:8787/api/info
              exit 0
            fi
            sleep 2
          done
          docker logs app
          exit 1

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ANNOTINDER_COMMIT=${{ steps.commit.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
