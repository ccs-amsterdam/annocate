# Builds the app image (Dockerfile) and publishes it as
# ghcr.io/ccs-amsterdam/annotinder (docs/hosting.md, "Versions"), for amd64 and arm64:
# - every push to a branch: tags the branch (main, or e.g. docker-image; a / in
#   its name becomes -) and the commit (8 characters, e.g. 1a2b3c4d);
# - a tag v<release> (e.g. v0.1.0): also tags 0.1.0, 0.1 and latest.
# The image records the commit it is built from (ANNOTINDER_COMMIT).
name: Image

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: A release tag matches the release in the code
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          release=$(sed -n 's/^export const RELEASE = "\(.*\)";/\1/p' packages/contracts/src/version.ts)
          if [ "v$release" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, but RELEASE in packages/contracts/src/version.ts is $release"
            exit 1
          fi

      - name: The commit
        id: commit
        run: echo "short=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 8
        with:
          images: ghcr.io/${{ github.repository_owner }}/annotinder
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ANNOTINDER_COMMIT=${{ steps.commit.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
